name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check src/ tests/ app.py

      - name: Format check (black)
        run: black --check src/ tests/ app.py

      - name: Security scan (bandit)
        run: bandit -r src/

      - name: Run test suite with coverage (mock mode - no API key needed)
        env:
          LLM_MODE: mock
        run: pytest tests/ --cov=src --cov-report=term-missing --cov-report=xml -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: coverage.xml

      - name: Run CLI demos end-to-end
        env:
          LLM_MODE: mock
        run: |
          python run_demo.py
          python run_yoy_comparison.py
          python run_evaluation.py
